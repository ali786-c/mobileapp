# Project-wide Gradle settings.
# Mapped to JVM arguments for the Gradle Daemon to prevent OutOfMemory/heap errors.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# Configure Kotlin compiler daemon memory limit
kotlin.daemon.jvmargs=-Xmx2g

# Enable AndroidX support
android.useAndroidX=true

# Enable Gradle Daemon for faster subsequent builds
org.gradle.daemon=true
org.gradle.daemon.performance.disable-logging=true
